<!DOCTYPE html>
<html lang="fa" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت انواع کتاب</title>

    <!-- لینک به فایل CSS -->
    <link rel="stylesheet" th:href="@{/css/bookType.css}">
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="page-header">
        <h1><span class="icon">📖</span> مدیریت انواع کتاب</h1>
        <button onclick="openCreateModal()" class="btn btn-success btn-lg">
            ➕ ثبت نوع کتاب جدید
        </button>
    </div>

    <!-- نمایش پیام‌ها -->
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <hr>

    <!-- Search Panel (اختیاری) -->
    <div class="search-panel">
        <h3>🔍 جستجوی انواع کتاب</h3>
        <form id="searchForm" onsubmit="searchBookTypes(event)">
            <div class="search-grid">
                <div class="search-group">
                    <label for="searchSubject">موضوع:</label>
                    <select id="searchSubject" name="subject">
                        <option value="">همه</option>
                        <option value="LITERATURE">ادبیات</option>
                        <option value="SCIENCE">علوم</option>
                        <option value="HUMANITIES">علوم انسانی</option>
                        <option value="ARTS">هنر</option>
                        <option value="ENGINEERING">مهندسی</option>
                        <option value="OTHERS">سایر</option>
                    </select>
                </div>

                <div class="search-group">
                    <label for="searchAgeGroup">گروه سنی:</label>
                    <select id="searchAgeGroup" name="ageGroup">
                        <option value="">همه</option>
                        <option value="CHILDREN">کودکان</option>
                        <option value="YOUNG_ADULT">جوانان</option>
                        <option value="ADULT">بزرگسالان</option>
                        <option value="ALL_AGES">همه سنین</option>
                    </select>
                </div>

                <div class="search-group">
                    <label for="searchLanguage">زبان:</label>
                    <select id="searchLanguage" name="language">
                        <option value="">همه</option>
                        <option value="PERSIAN">فارسی</option>
                        <option value="ENGLISH">انگلیسی</option>
                        <option value="ARABIC">عربی</option>
                        <option value="FRENCH">فرانسه</option>
                        <option value="GERMAN">آلمانی</option>
                        <option value="RUSSIAN">روسی</option>
                        <option value="OTHERS">سایر</option>
                    </select>
                </div>
            </div>

            <div class="search-buttons">
                <button type="submit" class="btn btn-primary">🔍 جستجو</button>
                <button type="reset" class="btn btn-secondary" onclick="resetSearch()">🔄 پاک کردن</button>
            </div>
        </form>
    </div>

    <!-- Result Count -->
    <div th:if="${bookTypes != null}" class="result-count">
        تعداد نتایج: <strong th:text="${#lists.size(bookTypes)}"></strong>
    </div>

    <h2>لیست انواع کتاب ثبت شده</h2>

    <!-- Table -->
    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>شناسه</th>
                <th>موضوع</th>
                <th>گروه سنی</th>
                <th>زبان</th>
                <th>وضعیت انتشار</th>
                <th>سطح کتاب</th>
                <th>دوره تاریخی</th>
                <th>تاریخ ایجاد</th>
                <th>ساعت ایجاد</th>
                <th>ایجاد کننده</th>
                <th>عملیات</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="bt : ${bookTypes}" th:if="${bookTypes != null and not #lists.isEmpty(bookTypes)}"
                th:data-id="${bt.bookTypeId}"
                th:data-subject="${bt.bookTypeSubject}"
                th:data-agegroup="${bt.bookTypeAgeGroup}"
                th:data-language="${bt.bookTypeLanguage}"
                th:data-pubstatus="${bt.bookTypePublicationStatus}"
                th:data-academiclevel="${bt.bookAcademicLevel}"
                th:data-historical="${bt.historicalPeriodLevel}">
                <td th:text="${bt.bookTypeId}"></td>
                <td th:text="${bt.bookTypeSubject}"></td>
                <td th:text="${bt.bookTypeAgeGroup}"></td>
                <td th:text="${bt.bookTypeLanguage}"></td>
                <td th:text="${bt.bookTypePublicationStatus}"></td>
                <td th:text="${bt.bookAcademicLevel} ?: '-'"></td>
                <td th:text="${bt.historicalPeriodLevel} ?: '-'"></td>
                <td th:text="${#temporals.format(bt.createdDate, 'yyyy-MM-dd')}"></td>
                <td th:text="${#temporals.format(bt.createdTime, 'HH:mm:ss')}"></td>
                <td th:text="${bt.createdBy}"></td>
                <td>
                    <button onclick="openEditModal(this)" class="btn btn-warning btn-sm">
                        ✏️ ویرایش
                    </button>
                </td>
            </tr>
            <tr th:if="${bookTypes == null or #lists.isEmpty(bookTypes)}">
                <td colspan="11" class="empty-state">
                    <span class="icon">📭</span>
                    <div class="message">هنوز هیچ نوع کتابی ثبت نشده است</div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="bookTypeModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 class="modal-title" id="modalTitle">ثبت نوع کتاب جدید</h2>

        <form id="bookTypeForm" th:action="@{/bookType/saveBookType}" method="post" th:object="${bookTypeDto}">
            <input type="hidden" id="bookTypeId" th:field="*{bookTypeId}" />

            <div class="form-group">
                <label for="bookTypeSubject">موضوع <span class="required">*</span></label>
                <select id="bookTypeSubject" th:field="*{bookTypeSubject}" required>
                    <option value="">انتخاب کنید</option>
                    <option value="LITERATURE">ادبیات</option>
                    <option value="SCIENCE">علوم</option>
                    <option value="HUMANITIES">علوم انسانی</option>
                    <option value="ARTS">هنر</option>
                    <option value="ENGINEERING">مهندسی</option>
                    <option value="OTHERS">سایر</option>
                </select>
            </div>

            <div class="form-group">
                <label for="bookTypeAgeGroup">گروه سنی <span class="required">*</span></label>
                <select id="bookTypeAgeGroup" th:field="*{bookTypeAgeGroup}" required>
                    <option value="">انتخاب کنید</option>
                    <option value="CHILDREN">کودکان</option>
                    <option value="YOUNG_ADULT">جوانان</option>
                    <option value="ADULT">بزرگسالان</option>
                    <option value="ALL_AGES">همه سنین</option>
                </select>
            </div>

            <div class="form-group">
                <label for="bookTypeLanguage">زبان <span class="required">*</span></label>
                <select id="bookTypeLanguage" th:field="*{bookTypeLanguage}" required>
                    <option value="">انتخاب کنید</option>
                    <option value="PERSIAN">فارسی</option>
                    <option value="ENGLISH">انگلیسی</option>
                    <option value="ARABIC">عربی</option>
                    <option value="FRENCH">فرانسه</option>
                    <option value="GERMAN">آلمانی</option>
                    <option value="RUSSIAN">روسی</option>
                    <option value="OTHERS">سایر</option>
                </select>
            </div>

            <div class="form-group">
                <label for="bookTypePublicationStatus">وضعیت انتشار <span class="required">*</span></label>
                <select id="bookTypePublicationStatus" th:field="*{bookTypePublicationStatus}" required>
                    <option value="">انتخاب کنید</option>
                    <option value="PUBLISHED">منتشر شده</option>
                    <option value="IN_PRESS">در حال چاپ</option>
                    <option value="PRE_PRINT">پیش از چاپ</option>
                    <option value="RE_PRINT">تجدید چاپ</option>
                </select>
            </div>

            <!-- سطح تحصیلی (فقط علوم و مهندسی) -->
            <div id="academicLevelGroup" class="form-group conditional">
                <label for="bookAcademicLevel">سطح تحصیلی:</label>
                <select id="bookAcademicLevel" th:field="*{bookAcademicLevel}">
                    <option value="">انتخاب کنید</option>
                    <option value="BEGINNER">مبتدی</option>
                    <option value="INTERMEDIATE">متوسط</option>
                    <option value="ADVANCED">پیشرفته</option>
                    <option value="REFERENCE">مرجع</option>
                </select>
            </div>

            <!-- دوره تاریخی (فقط ادبیات) -->
            <div id="historicalGroup" class="form-group conditional">
                <label for="historicalPeriodLevel">دوره تاریخی:</label>
                <select id="historicalPeriodLevel" th:field="*{historicalPeriodLevel}">
                    <option value="">انتخاب کنید</option>
                    <option value="ANCIENT">باستان</option>
                    <option value="MEDIEVAL">قرون وسطی</option>
                    <option value="MODERN">مدرن</option>
                    <option value="CONTEMPORARY">معاصر</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" id="submitBtn" class="btn btn-success">ذخیره</button>
                <button type="button" onclick="closeModal()" class="btn btn-danger">انصراف</button>
            </div>
        </form>
    </div>
</div>

<!-- لینک به فایل JavaScript -->
<script th:src="@{/js/bookType.js}"></script>

</body>
</html>
