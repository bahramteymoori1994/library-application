<!DOCTYPE html>
<html lang="fa" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت نقش‌ها</title>
    <link rel="stylesheet" th:href="@{/css/role.css}">
</head>
<body>
<div class="container">
    <!-- Header -->
    <div class="page-header">
        <h1>🔑 مدیریت اطلاعات نقش‌ها</h1>
        <button onclick="openCreateModal()" class="btn btn-success">
            ➕ ثبت نقش جدید
        </button>
    </div>

    <!-- نمایش پیام‌ها -->
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <hr>
    <h2>لیست نقش‌های ثبت شده</h2>

    <!-- Table -->
    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>شناسه</th>
                <th>عنوان نقش (انگلیسی)</th>
                <th>عنوان نقش (فارسی)</th>
                <th>تاریخ ایجاد</th>
                <th>ساعت ایجاد</th>
                <th>ایجاد کننده</th>
                <th>عملیات</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${roles}" th:if="${roles != null and not #lists.isEmpty(roles)}"
                th:data-id="${r.roleId}"
                th:data-englishtitle="${r.englishRoleTitle}"
                th:data-farsititle="${r.farsiRoleTitle}">
                <td th:text="${r.roleId}"></td>
                <td th:text="${r.englishRoleTitle}"></td>
                <td th:text="${r.farsiRoleTitle}"></td>
                <td th:text="${#temporals.format(r.createdDate, 'yyyy-MM-dd')}"></td>
                <td th:text="${#temporals.format(r.createdTime, 'HH:mm:ss')}"></td>
                <td th:text="${r.createdBy}"></td>
                <td>
                    <button onclick="openEditModal(this)" class="btn btn-warning btn-sm">
                        ✏️ ویرایش
                    </button>
                </td>
            </tr>
            <tr th:if="${roles == null or #lists.isEmpty(roles)}">
                <td colspan="7" class="empty-state">
                    <div>📭</div>
                    <div style="margin-top: 10px;">هنوز هیچ نقشی ثبت نشده است</div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="roleModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 class="modal-title" id="modalTitle">ثبت نقش جدید</h2>

        <form id="roleForm" th:object="${roleDto}">
            <input type="hidden" id="roleId" th:field="*{roleId}" name="roleId" />

            <div class="form-group">
                <label for="englishRoleTitle">عنوان نقش (انگلیسی):</label>
                <input type="text" id="englishRoleTitle" th:field="*{englishRoleTitle}" name="englishRoleTitle" required placeholder="مثال: ADMIN" />
            </div>

            <div class="form-group">
                <label for="farsiRoleTitle">عنوان نقش (فارسی):</label>
                <input type="text" id="farsiRoleTitle" th:field="*{farsiRoleTitle}" name="farsiRoleTitle" required placeholder="مثال: مدیر سیستم" />
            </div>

            <div class="form-actions">
                <button type="submit" id="submitBtn" class="btn btn-success">ذخیره</button>
                <button type="button" onclick="closeModal()" class="btn btn-danger">انصراف</button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/role.js}"></script>
</body>
</html>
