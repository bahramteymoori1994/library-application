<!DOCTYPE html>
<html lang="fa" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت انواع کتابخانه</title>

    <!-- لینک به فایل CSS -->
    <link rel="stylesheet" th:href="@{/css/libraryType.css}">
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="page-header">
        <h1><span class="icon">📚</span> مدیریت انواع کتابخانه</h1>
        <button onclick="openCreateModal()" class="btn btn-success btn-lg">
            ➕ ثبت نوع کتابخانه جدید
        </button>
    </div>

    <!-- نمایش پیام‌ها -->
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <hr>

    <!-- Search Panel (اختیاری) -->
    <div class="search-panel">
        <h3>🔍 جستجوی انواع کتابخانه</h3>
        <form id="searchForm" onsubmit="searchLibraryTypes(event)">
            <div class="search-grid">
                <div class="search-group">
                    <label for="searchAccessibility">دسترسی:</label>
                    <select id="searchAccessibility" name="accessibility">
                        <option value="">همه</option>
                        <option value="OPEN_ACCESS">دسترسی باز</option>
                        <option value="RESTRICTED">محدود</option>
                        <option value="MEMBERSHIP_BASED">بر اساس عضویت</option>
                        <option value="REFERENCE">مرجع</option>
                    </select>
                </div>

                <div class="search-group">
                    <label for="searchOwnership">مالکیت:</label>
                    <select id="searchOwnership" name="ownership">
                        <option value="">همه</option>
                        <option value="PUBLIC">عمومی</option>
                        <option value="ACADEMIC">آکادمیک</option>
                        <option value="SPECIAL">ویژه</option>
                        <option value="NATIONAL">ملی</option>
                        <option value="CORPORATE">شرکتی</option>
                        <option value="PRIVATE">خصوصی</option>
                    </select>
                </div>

                <div class="search-group">
                    <label for="searchScope">گستره:</label>
                    <select id="searchScope" name="scope">
                        <option value="">همه</option>
                        <option value="NEIGHBORHOOD">محله‌ای</option>
                        <option value="CITY">شهری</option>
                        <option value="PROVINCIAL">استانی</option>
                        <option value="NATIONAL">ملی</option>
                        <option value="INTERNATIONAL">بین‌المللی</option>
                    </select>
                </div>
            </div>

            <div class="search-buttons">
                <button type="submit" class="btn btn-primary">🔍 جستجو</button>
                <button type="reset" class="btn btn-secondary" onclick="resetSearch()">🔄 پاک کردن</button>
            </div>
        </form>
    </div>

    <!-- Result Count -->
    <div th:if="${libraryTypes != null}" class="result-count">
        تعداد نتایج: <strong th:text="${#lists.size(libraryTypes)}"></strong>
    </div>

    <h2>لیست انواع کتابخانه ثبت شده</h2>

    <!-- Table -->
    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>شناسه</th>
                <th>دسترسی</th>
                <th>مالکیت</th>
                <th>گستره</th>
                <th>نوع خدمت</th>
                <th>اندازه</th>
                <th>دوره تاریخی</th>
                <th>تاریخ ایجاد</th>
                <th>ساعت ایجاد</th>
                <th>ایجاد کننده</th>
                <th>عملیات</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="l : ${libraryTypes}" th:if="${libraryTypes != null and not #lists.isEmpty(libraryTypes)}"
                th:data-id="${l.libraryTypeId}"
                th:data-accessibility="${l.libraryTypeAccessibility}"
                th:data-ownership="${l.libraryTypeOwnership}"
                th:data-scope="${l.libraryTypeScope}"
                th:data-service="${l.libraryTypeService}"
                th:data-size="${l.libraryTypeSize}"
                th:data-historical="${l.historicalPeriodLevel}">
                <td th:text="${l.libraryTypeId}"></td>
                <td th:text="${l.libraryTypeAccessibility}"></td>
                <td th:text="${l.libraryTypeOwnership}"></td>
                <td th:text="${l.libraryTypeScope}"></td>
                <td th:text="${l.libraryTypeService}"></td>
                <td th:text="${l.libraryTypeSize}"></td>
                <td th:text="${l.historicalPeriodLevel} ?: '-'"></td>
                <td th:text="${#temporals.format(l.createdDate, 'yyyy-MM-dd')}"></td>
                <td th:text="${#temporals.format(l.createdTime, 'HH:mm:ss')}"></td>
                <td th:text="${l.createdBy}"></td>
                <td>
                    <button onclick="openEditModal(this)" class="btn btn-warning btn-sm">
                        ✏️ ویرایش
                    </button>
                </td>
            </tr>
            <tr th:if="${libraryTypes == null or #lists.isEmpty(libraryTypes)}">
                <td colspan="11" class="empty-state">
                    <span class="icon">📭</span>
                    <div class="message">هنوز هیچ نوع کتابخانه‌ای ثبت نشده است</div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="libraryTypeModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 class="modal-title" id="modalTitle">ثبت نوع کتابخانه جدید</h2>

        <form id="libraryTypeForm" th:action="@{/libraryType/saveLibraryType}" method="post" th:object="${libraryTypeDto}">
            <input type="hidden" id="libraryTypeId" th:field="*{libraryTypeId}" />

            <div class="form-group">
                <label for="libraryTypeAccessibility">دسترسی <span class="required">*</span></label>
                <select id="libraryTypeAccessibility" th:field="*{libraryTypeAccessibility}" required>
                    <option value="">انتخاب کنید</option>
                    <option value="OPEN_ACCESS">دسترسی باز</option>
                    <option value="RESTRICTED">محدود</option>
                    <option value="MEMBERSHIP_BASED">بر اساس عضویت</option>
                    <option value="REFERENCE">مرجع</option>
                </select>
            </div>

            <div class="form-group">
                <label for="libraryTypeOwnership">مالکیت <span class="required">*</span></label>
                <select id="libraryTypeOwnership" th:field="*{libraryTypeOwnership}" required>
                    <option value="">انتخاب کنید</option>
                    <option value="PUBLIC">عمومی</option>
                    <option value="ACADEMIC">آکادمیک</option>
                    <option value="SPECIAL">ویژه</option>
                    <option value="NATIONAL">ملی</option>
                    <option value="CORPORATE">شرکتی</option>
                    <option value="PRIVATE">خصوصی</option>
                </select>
            </div>

            <div class="form-group">
                <label for="libraryTypeScope">گستره <span class="required">*</span></label>
                <select id="libraryTypeScope" th:field="*{libraryTypeScope}" required>
                    <option value="">انتخاب کنید</option>
                    <option value="NEIGHBORHOOD">محله‌ای</option>
                    <option value="CITY">شهری</option>
                    <option value="PROVINCIAL">استانی</option>
                    <option value="NATIONAL">ملی</option>
                    <option value="INTERNATIONAL">بین‌المللی</option>
                </select>
            </div>

            <div class="form-group">
                <label for="libraryTypeService">نوع خدمت <span class="required">*</span></label>
                <select id="libraryTypeService" th:field="*{libraryTypeService}" required>
                    <option value="">انتخاب کنید</option>
                    <option value="TRADITIONAL">سنتی</option>
                    <option value="RESEARCH">پژوهشی</option>
                    <option value="EDUCATIONAL">آموزشی</option>
                    <option value="COMMUNITY">اجتماعی</option>
                    <option value="COMPREHENSIVE">جامع</option>
                </select>
            </div>

            <div class="form-group">
                <label for="libraryTypeSize">اندازه <span class="required">*</span></label>
                <select id="libraryTypeSize" th:field="*{libraryTypeSize}" required>
                    <option value="">انتخاب کنید</option>
                    <option value="SMALL">کوچک</option>
                    <option value="MEDIUM">متوسط</option>
                    <option value="LARGE">بزرگ</option>
                    <option value="VERY_LARGE">بسیار بزرگ</option>
                </select>
            </div>

            <div class="form-group">
                <label for="historicalPeriodLevel">دوره تاریخی:</label>
                <select id="historicalPeriodLevel" th:field="*{historicalPeriodLevel}">
                    <option value="">انتخاب کنید</option>
                    <option value="ANCIENT">باستان</option>
                    <option value="MEDIEVAL">قرون وسطی</option>
                    <option value="MODERN">مدرن</option>
                    <option value="CONTEMPORARY">معاصر</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" id="submitBtn" class="btn btn-success">ذخیره</button>
                <button type="button" onclick="closeModal()" class="btn btn-danger">انصراف</button>
            </div>
        </form>
    </div>
</div>

<!-- لینک به فایل JavaScript -->
<script th:src="@{/js/libraryType.js}"></script>

</body>
</html>
