<!DOCTYPE html>
<html lang="fa" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت اشخاص</title>

    <style>
        body { font-family: Tahoma, sans-serif; direction: rtl; text-align: right; margin: 20px; }
        .container { max-width: 1250px; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { padding: 12px; border: 1px solid #aaa; text-align: right; }
        th { background-color: #f4f4f4; }

        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #fefefe; margin: 5% auto; padding: 25px; border: 1px solid #888; width: 52%; border-radius: 8px; }
        .close { color: #aaa; float: right; font-size: 32px; font-weight: bold; cursor: pointer; }
        .close:hover { color: black; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 12px 22px; margin: 6px 4px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h1>مدیریت اطلاعات اشخاص</h1>

    <div th:if="${message}" style="padding:12px; background:#d4edda; color:#155724; border-radius:5px; margin:15px 0;" th:text="${message}"></div>

    <button onclick="openCreateModal()" style="background:#28a745; color:white; padding:12px 24px;">
        + ثبت شخص جدید
    </button>

    <hr>

    <h2>لیست اشخاص ثبت شده</h2>
    <table>
        <thead>
        <tr>
            <th>شناسه</th>
            <th>نام</th>
            <th>نام خانوادگی</th>
            <th>کد ملی</th>
            <th>نام پدر</th>
            <th>تاریخ تولد</th>
            <th>جنسیت</th>
            <th>شماره تلفن</th>
            <th>تاریخ ایجاد</th>
            <th>ساعت ایجاد</th>
            <th>ایجاد کننده</th>
            <th>عملیات</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${persons}" th:if="${persons != null and not #lists.isEmpty(persons)}"
            th:data-id="${p.personId}"
            th:data-firstname="${p.firstName}"
            th:data-lastname="${p.lastName}"
            th:data-nationalcode="${p.nationalCode}"
            th:data-fathername="${p.fatherName}"
            th:data-birthdate="${#temporals.format(p.birthDate, 'yyyy-MM-dd')}"
            th:data-gender="${p.gender}"
            th:data-phonenumber="${p.phoneNumber}">

            <td th:text="${p.personId}"></td>
            <td th:text="${p.firstName}"></td>
            <td th:text="${p.lastName}"></td>
            <td th:text="${p.nationalCode}"></td>
            <td th:text="${p.fatherName}"></td>
            <td th:text="${#temporals.format(p.birthDate, 'yyyy-MM-dd')}"></td>
            <td th:text="${p.gender == 'MALE'} ? 'زن' : 'مرد'"></td>
            <td th:text="${p.phoneNumber}"></td>
            <td th:text="${#temporals.format(p.createdDate, 'yyyy-MM-dd')}"></td>
            <td th:text="${#temporals.format(p.createdTime, 'HH:mm:ss')}"></td>
            <td th:text="${p.createdBy}"></td>
            <td>
                <button onclick="openEditModal(this)"
                        style="background:#ffc107; color:black; padding:8px 16px;">
                    ✏️ ویرایش
                </button>
            </td>
        </tr>
        <tr th:if="${persons == null or #lists.isEmpty(persons)}">
            <td colspan="12" style="text-align:center; color:#888; padding:20px;">
                هنوز هیچ شخصی ثبت نشده است.
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Modal -->
<div id="personModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle">ثبت شخص جدید</h2>

        <form id="personForm" th:action="@{/person/savePerson}" method="post" th:object="${personDto}">
            <input type="hidden" id="personId" th:field="*{personId}" />

            <div class="form-group">
                <label>نام:</label>
                <input type="text" id="firstName" th:field="*{firstName}" required />
            </div>
            <div class="form-group">
                <label>نام خانوادگی:</label>
                <input type="text" id="lastName" th:field="*{lastName}" required />
            </div>
            <div class="form-group">
                <label>کد ملی:</label>
                <input type="text" id="nationalCode" th:field="*{nationalCode}" maxlength="10" required />
            </div>
            <div class="form-group">
                <label>نام پدر:</label>
                <input type="text" id="fatherName" th:field="*{fatherName}" required />
            </div>
            <div class="form-group">
                <label>تاریخ تولد:</label>
                <input type="date" id="birthDate" th:field="*{birthDate}" required />
            </div>
            <div class="form-group">
                <label>جنسیت:</label>
                <select id="gender" th:field="*{gender}">
                    <option value="MALE">مرد</option>
                    <option value="FEMALE">زن</option>
                </select>
            </div>
            <div class="form-group">
                <label>شماره تلفن:</label>
                <input type="text" id="phoneNumber" th:field="*{phoneNumber}" maxlength="11" required />
            </div>

            <div style="margin-top: 20px;">
                <button type="submit" id="submitBtn" style="background:#28a745; color:white;">ذخیره</button>
                <button type="button" onclick="closeModal()" style="background:#dc3545; color:white;">انصراف</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openCreateModal() {
        document.getElementById("modalTitle").textContent = "ثبت شخص جدید";
        document.getElementById("submitBtn").textContent = "ذخیره";
        document.getElementById("personForm").reset();
        document.getElementById("personId").value = "";
        document.getElementById("personModal").style.display = "block";
    }

    function openEditModal(btn) {
        const row = btn.closest('tr');

        document.getElementById("modalTitle").textContent = "ویرایش شخص";
        document.getElementById("submitBtn").textContent = "به‌روزرسانی";

        document.getElementById("personId").value = row.dataset.id;
        document.getElementById("firstName").value = row.dataset.firstname;
        document.getElementById("lastName").value = row.dataset.lastname;
        document.getElementById("nationalCode").value = row.dataset.nationalcode;
        document.getElementById("fatherName").value = row.dataset.fathername;
        document.getElementById("birthDate").value = row.dataset.birthdate;
        document.getElementById("gender").value = row.dataset.gender;
        document.getElementById("phoneNumber").value = row.dataset.phonenumber;

        document.getElementById("personModal").style.display = "block";
    }

    function closeModal() {
        document.getElementById("personModal").style.display = "none";
    }
</script>

</body>
</html>
