<!DOCTYPE html>
<html lang="fa" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت اشخاص</title>

    <!-- لینک به فایل CSS -->
    <link rel="stylesheet" th:href="@{/css/person.css}">
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="page-header">
        <h1>📋 مدیریت اطلاعات اشخاص</h1>
        <button onclick="openCreateModal()" class="btn btn-success">
            ➕ ثبت شخص جدید
        </button>
    </div>

    <!-- نمایش پیام‌ها -->
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <hr>

    <!-- Search Panel -->
    <div class="search-panel">
        <h3>🔍 جستجوی پیشرفته</h3>
        <form th:action="@{/person/search}" method="post" th:object="${searchDto}">
            <div class="search-grid">
                <div class="search-group">
                    <label for="searchFirstName">نام:</label>
                    <input type="text" id="searchFirstName" th:field="*{firstName}"
                           placeholder="جستجوی نام..." />
                </div>

                <div class="search-group">
                    <label for="searchLastName">نام خانوادگی:</label>
                    <input type="text" id="searchLastName" th:field="*{lastName}"
                           placeholder="جستجوی نام خانوادگی..." />
                </div>

                <div class="search-group">
                    <label for="searchNationalCode">کد ملی:</label>
                    <input type="text" id="searchNationalCode" th:field="*{nationalCode}"
                           placeholder="کد ملی..." />
                </div>

                <div class="search-group">
                    <label for="searchPhoneNumber">شماره تلفن:</label>
                    <input type="text" id="searchPhoneNumber" th:field="*{phoneNumber}"
                           placeholder="شماره تلفن..." />
                </div>

                <div class="search-group">
                    <label for="searchBirthDate">تاریخ تولد:</label>
                    <input type="date" id="searchBirthDate" th:field="*{birthDate}" />
                </div>

                <div class="search-group">
                    <label for="searchGender">جنسیت:</label>
                    <select id="searchGender" th:field="*{gender}">
                        <option value="">همه</option>
                        <option value="MALE">مرد</option>
                        <option value="FEMALE">زن</option>
                    </select>
                </div>
            </div>

            <div class="search-buttons">
                <button type="submit" class="btn btn-primary">🔍 جستجو</button>
                <button type="reset" class="btn btn-secondary" onclick="resetSearch()">🔄 پاک کردن</button>
            </div>
        </form>
    </div>

    <!-- Result Count -->
    <div th:if="${persons != null}" class="result-count">
        تعداد نتایج: <strong th:text="${#lists.size(persons)}"></strong>
    </div>

    <!-- Table -->
    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>شناسه</th>
                <th>نام</th>
                <th>نام خانوادگی</th>
                <th>کد ملی</th>
                <th>نام پدر</th>
                <th>تاریخ تولد</th>
                <th>جنسیت</th>
                <th>شماره تلفن</th>
                <th>تاریخ ایجاد</th>
                <th>ساعت ایجاد</th>
                <th>ایجاد کننده</th>
                <th>عملیات</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${persons}" th:if="${persons != null and not #lists.isEmpty(persons)}"
                th:data-id="${p.personId}"
                th:data-firstname="${p.firstName}"
                th:data-lastname="${p.lastName}"
                th:data-nationalcode="${p.nationalCode}"
                th:data-fathername="${p.fatherName}"
                th:data-birthdate="${#temporals.format(p.birthDate, 'yyyy-MM-dd')}"
                th:data-gender="${p.gender}"
                th:data-phonenumber="${p.phoneNumber}">

                <td th:text="${p.personId}"></td>
                <td th:text="${p.firstName}"></td>
                <td th:text="${p.lastName}"></td>
                <td th:text="${p.nationalCode}"></td>
                <td th:text="${p.fatherName}"></td>
                <td th:text="${#temporals.format(p.birthDate, 'yyyy-MM-dd')}"></td>
                <td>
                        <span th:class="'badge ' + (p.gender == 'MALE' ? 'badge-male' : 'badge-female')"
                              th:text="${p.gender == 'MALE'} ? 'زن' : 'مرد'"></span>
                </td>
                <td th:text="${p.phoneNumber}"></td>
                <td th:text="${#temporals.format(p.createdDate, 'yyyy-MM-dd')}"></td>
                <td th:text="${#temporals.format(p.createdTime, 'HH:mm:ss')}"></td>
                <td th:text="${p.createdBy}"></td>
                <td>
                    <button onclick="openEditModal(this)" class="btn btn-warning btn-sm">
                        ✏️ ویرایش
                    </button>
                </td>
            </tr>
            <tr th:if="${persons == null or #lists.isEmpty(persons)}">
                <td colspan="12" class="empty-state">
                    <div>📭</div>
                    <div style="margin-top: 10px;">هیچ شخصی یافت نشد</div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="personModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 class="modal-title" id="modalTitle">ثبت شخص جدید</h2>

        <form id="personForm" th:action="@{/person/savePerson}" method="post" th:object="${personDto}">
            <input type="hidden" id="personId" th:field="*{personId}" />

            <div class="form-group">
                <label for="firstName">نام:</label>
                <input type="text" id="firstName" th:field="*{firstName}" required />
            </div>

            <div class="form-group">
                <label for="lastName">نام خانوادگی:</label>
                <input type="text" id="lastName" th:field="*{lastName}" required />
            </div>

            <div class="form-group">
                <label for="nationalCode">کد ملی:</label>
                <input type="text" id="nationalCode" th:field="*{nationalCode}" maxlength="10" required />
            </div>

            <div class="form-group">
                <label for="fatherName">نام پدر:</label>
                <input type="text" id="fatherName" th:field="*{fatherName}" required />
            </div>

            <div class="form-group">
                <label for="birthDate">تاریخ تولد:</label>
                <input type="date" id="birthDate" th:field="*{birthDate}" required />
            </div>

            <div class="form-group">
                <label for="gender">جنسیت:</label>
                <select id="gender" th:field="*{gender}">
                    <option value="MALE">مرد</option>
                    <option value="FEMALE">زن</option>
                </select>
            </div>

            <div class="form-group">
                <label for="phoneNumber">شماره تلفن:</label>
                <input type="text" id="phoneNumber" th:field="*{phoneNumber}" maxlength="11" required />
            </div>

            <div class="form-actions">
                <button type="submit" id="submitBtn" class="btn btn-success">ذخیره</button>
                <button type="button" onclick="closeModal()" class="btn btn-danger">انصراف</button>
            </div>
        </form>
    </div>
</div>

<!-- لینک به فایل JavaScript -->
<script th:src="@{/js/person.js}"></script>

</body>
</html>
