<!DOCTYPE html>
<html lang="fa" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت رسیدها</title>
    <link rel="stylesheet" th:href="@{/css/receipt.css}">
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="page-header">
        <h1>🧾 مدیریت رسیدها</h1>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button onclick="openCreateModal()" class="btn btn-success">
                ➕ ثبت رسید جدید
            </button>
            <button onclick="refreshReceipts()" class="btn btn-primary">
                🔄 بروزرسانی
            </button>
        </div>
    </div>

    <!-- نمایش پیام‌ها -->
    <div id="messageContainer"></div>

    <hr>

    <!-- فیلتر کاربر (یک اینپوت برای همه) -->
    <div class="filter-section">
        <label for="usernameFilter">
            <span th:if="${isAdminOrLibrarian}">👤 فیلتر بر اساس کاربر:</span>
            <span th:unless="${isAdminOrLibrarian}">👤 کاربر فعلی:</span>
        </label>

        <input type="text" id="usernameFilter"
               th:value="${currentUsername}"
               th:placeholder="${isAdminOrLibrarian} ? 'نام کاربری را وارد کنید...' : ''"
               th:readonly="${!isAdminOrLibrarian}"
               th:style="${!isAdminOrLibrarian} ? 'background:#f0f0f0; cursor: not-allowed;' : ''" />

        <!-- دکمه‌های ادمین -->
        <th:block th:if="${isAdminOrLibrarian}">
            <button onclick="loadReceiptsByUsername()" class="btn btn-primary">جستجو</button>
            <button onclick="loadAllReceipts()" class="btn btn-secondary">نمایش همه</button>
            <button onclick="clearFilter()" class="btn btn-danger">پاک کردن</button>
        </th:block>

        <!-- دکمه کاربر عادی -->
        <button th:unless="${isAdminOrLibrarian}"
                onclick="loadReceiptsByUsername()"
                class="btn btn-primary">بروزرسانی لیست</button>

        <span id="resultCount" class="text-muted"></span>
    </div>

    <h2>📋 لیست رسیدهای ثبت شده</h2>

    <!-- Table -->
    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>شناسه رسید</th>
                <th>تاریخ رسید</th>
                <th>زمان رسید</th>
                <th>کاربر</th>
                <th>عنوان کتاب</th>
                <th>شابک</th>
                <th>ناشر</th>
                <th>موضوع</th>
                <th>تعداد کتاب</th>
                <th>وضعیت</th>
                <th>تاریخ ایجاد</th>
                <th>ایجاد کننده</th>
                <th>عملیات</th>
            </tr>
            </thead>
            <tbody id="receiptTableBody">
            <!-- رسیدها توسط JavaScript بارگذاری می‌شوند -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal ثبت/ویرایش رسید -->
<div id="receiptModal" class="modal">
    <div class="modal-content">
        <button class="close" onclick="closeModal()">×</button>
        <h2 class="modal-title" id="modalTitle">📝 ثبت رسید جدید</h2>

        <form id="receiptForm" method="post" th:object="${receiptDto}" th:action="@{/receipt/saveReceipt}">
            <input type="hidden" id="receiptId" name="receiptId" />
            <input type="hidden" id="formAction" name="formAction" value="save" />
            <input type="hidden" id="receiptMethod" name="_method" value="POST" />

            <div class="form-group">
                <label>کتاب‌ها <span class="required">*</span></label>
                <div class="search-container">
                    <input type="text" id="booksDisplay" readonly placeholder="هیچ کتابی انتخاب نشده"
                           style="flex:1; background:#f8f9fa; cursor: pointer;">
                    <button type="button" onclick="openBookSearch()" class="btn btn-info">
                        🔍 جستجو و انتخاب کتاب
                    </button>
                </div>
                <div id="selectedBooksContainer"></div>
                <div id="bookIdsContainer"></div>
            </div>

            <div class="form-actions">
                <button type="submit" id="submitBtn" class="btn btn-success">💾 ذخیره</button>
                <button type="button" onclick="closeModal()" class="btn btn-danger">❌ انصراف</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal جستجوی کتاب -->
<div id="bookSearchModal" class="modal">
    <div class="modal-content">
        <button class="close" onclick="closeBookSearch()">×</button>
        <h2 class="modal-title">🔍 انتخاب کتاب‌ها</h2>

        <div class="search-container" style="margin-bottom: 15px;">
            <div class="search-input-wrapper">
                <input type="text" id="bookSearchInput" placeholder="جستجو بر اساس عنوان کتاب..." />
                <span class="search-icon">🔍</span>
            </div>
            <button onclick="searchBooks()" class="btn btn-primary">جستجو</button>
            <button onclick="clearBookSearch()" class="btn btn-secondary">پاک کردن</button>
        </div>

        <div class="table-container" style="max-height: 400px; overflow-y: auto;">
            <table>
                <thead>
                <tr>
                    <th>شناسه</th>
                    <th>عنوان کتاب</th>
                    <th>شابک</th>
                    <th>نویسندگان</th>
                    <th style="text-align: center;">انتخاب</th>
                </tr>
                </thead>
                <tbody id="bookTableBody"></tbody>
            </table>
        </div>

        <div class="form-actions">
            <button onclick="closeBookSearch()" class="btn btn-danger">❌ بستن</button>
            <button onclick="confirmSelectedBooks()" class="btn btn-success">✅ تایید انتخاب‌ها</button>
        </div>
    </div>
</div>

<!-- Modal اکشن‌های تأیید / رد / عودت -->
<div id="actionModal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
        <button class="close" onclick="closeActionModal()">×</button>
        <h2 class="modal-title" id="actionModalTitle">ثبت توضیحات</h2>

        <input type="hidden" id="actionReceiptId" />
        <input type="hidden" id="actionType" />

        <div class="form-group">
            <label for="actionDescription">توضیحات <span class="required">*</span></label>
            <textarea id="actionDescription" rows="4" placeholder="توضیحات را وارد کنید..."
                      style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px; font-family:Tahoma; resize:vertical;"></textarea>
        </div>

        <div class="form-actions">
            <button type="button" onclick="submitAction()" class="btn btn-success" id="actionSubmitBtn">✅ تأیید</button>
            <button type="button" onclick="closeActionModal()" class="btn btn-danger">❌ انصراف</button>
        </div>
    </div>
</div>

<script th:src="@{/js/receipt.js}"></script>

<!-- اسکریپت اولیه -->
<script th:inline="javascript">
    /*<![CDATA[*/
    const isAdminOrLibrarian = /*[[${isAdminOrLibrarian}]]*/ false;
    const currentUsernameFromServer = /*[[${currentUsername}]]*/ '';
    /*]]>*/

    document.addEventListener('DOMContentLoaded', function() {
        console.log('📄 صفحه رسیدها بارگذاری شد | isAdminOrLibrarian =', isAdminOrLibrarian);

        if (typeof loadBooks === 'function') {
            loadBooks('');
        }

        setTimeout(function() {
            if (isAdminOrLibrarian) {
                // ادمین / کتابدار → همه رسیدها بدون فیلتر
                if (typeof loadAllReceipts === 'function') {
                    loadAllReceipts();
                }
            } else {
                // کاربر عادی → فقط رسیدهای خودش
                const usernameInput = document.getElementById('usernameFilter');
                if (usernameInput && !usernameInput.value) {
                    usernameInput.value = currentUsernameFromServer;
                }
                if (typeof loadReceiptsByUsername === 'function') {
                    loadReceiptsByUsername();
                }
            }
        }, 300);
    });

    // تابع کمکی برای دکمه بروزرسانی
    function refreshReceipts() {
        if (isAdminOrLibrarian) {
            loadAllReceipts();
        } else {
            loadReceiptsByUsername();
        }
    }
</script>

</body>
</html>
