<!DOCTYPE html>
<html lang="fa" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت ناشران</title>

    <!-- لینک به فایل CSS -->
    <link rel="stylesheet" th:href="@{/css/publisher.css}">
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="page-header">
        <h1><span class="icon">🏢</span> مدیریت ناشران</h1>
        <button onclick="openCreateModal()" class="btn btn-success btn-lg">
            ➕ ثبت ناشر جدید
        </button>
    </div>

    <!-- نمایش پیام‌ها -->
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <hr>

    <!-- Search Panel (اختیاری) -->
    <div class="search-panel">
        <h3>🔍 جستجوی ناشران</h3>
        <form id="searchForm" onsubmit="searchPublishers(event)">
            <div class="search-grid">
                <div class="search-group">
                    <label for="searchName">نام ناشر:</label>
                    <input type="text" id="searchName" name="name" placeholder="جستجوی نام..." />
                </div>

                <div class="search-group">
                    <label for="searchCity">شهر:</label>
                    <input type="text" id="searchCity" name="city" placeholder="جستجوی شهر..." />
                </div>

                <div class="search-group">
                    <label for="searchCountry">کشور:</label>
                    <input type="text" id="searchCountry" name="country" placeholder="جستجوی کشور..." />
                </div>
            </div>

            <div class="search-buttons">
                <button type="submit" class="btn btn-primary">🔍 جستجو</button>
                <button type="reset" class="btn btn-secondary" onclick="resetSearch()">🔄 پاک کردن</button>
            </div>
        </form>
    </div>

    <!-- Result Count -->
    <div th:if="${publishers != null}" class="result-count">
        تعداد نتایج: <strong th:text="${#lists.size(publishers)}"></strong>
    </div>

    <h2>لیست ناشران ثبت شده</h2>

    <!-- Table -->
    <div class="table-container">
        <table class="table-hover">
            <thead>
            <tr>
                <th>شناسه</th>
                <th>نام</th>
                <th>نوع ناشر</th>
                <th>کد</th>
                <th>کشور</th>
                <th>شهر</th>
                <th>آدرس</th>
                <th>تاریخ ایجاد</th>
                <th>ساعت ایجاد</th>
                <th>ایجاد کننده</th>
                <th>عملیات</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${publishers}" th:if="${publishers != null and not #lists.isEmpty(publishers)}">
                <td th:text="${p.publisherId}"></td>
                <td th:text="${p.publisherName}"></td>
                <td th:text="${p.publisherTypeName}"></td>
                <td th:text="${p.publisherCode}"></td>
                <td th:text="${p.publisherCountry}"></td>
                <td th:text="${p.publisherCity}"></td>
                <td th:text="${p.publisherAddress}"></td>
                <td th:text="${#temporals.format(p.createdDate, 'yyyy-MM-dd')}"></td>
                <td th:text="${#temporals.format(p.createdTime, 'HH:mm:ss')}"></td>
                <td th:text="${p.createdBy}"></td>
                <td>
                    <button onclick="openEditModal(this)" class="btn btn-warning btn-sm">
                        ✏️ ویرایش
                    </button>
                </td>
            </tr>
            <tr th:if="${publishers == null or #lists.isEmpty(publishers)}">
                <td colspan="11" class="empty-state">
                    <span class="icon">📭</span>
                    <div class="message">هنوز هیچ ناشری ثبت نشده است</div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal ثبت/ویرایش ناشر -->
<div id="publisherModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">×</span>
        <h2 class="modal-title" id="modalTitle">ثبت ناشر جدید</h2>

        <form id="publisherForm" method="post" th:object="${publisherDto}">
            <input type="hidden" id="publisherId" name="publisherId" />

            <div class="form-group">
                <label for="name">نام ناشر <span class="required">*</span></label>
                <input type="text" id="name" name="name" required placeholder="مثال: انتشارات علمی" />
            </div>

            <div class="form-group">
                <label for="code">کد ناشر <span class="required">*</span></label>
                <input type="text" id="code" name="code" maxlength="5" required placeholder="مثال: ۱۲۳۴۵" />
            </div>

            <div class="form-group">
                <label for="city">شهر <span class="required">*</span></label>
                <input type="text" id="city" name="city" required placeholder="مثال: تهران" />
            </div>

            <div class="form-group">
                <label for="country">کشور <span class="required">*</span></label>
                <input type="text" id="country" name="country" required placeholder="مثال: ایران" />
            </div>

            <div class="form-group">
                <label for="address">آدرس:</label>
                <textarea id="address" name="address" rows="3" placeholder="آدرس کامل ناشر را وارد کنید..." style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;"></textarea>
            </div>

            <div class="form-group">
                <label for="phone">تلفن:</label>
                <input type="text" id="phone" name="phone" placeholder="مثال: ۰۲۱-۱۲۳۴۵۶۷۸" />
            </div>

            <div class="form-group">
                <label for="publisherTypeId">نوع ناشر <span class="required">*</span></label>
                <div class="search-container">
                    <input type="number" id="publisherTypeId" name="publisherType" required style="flex:1;" placeholder="شناسه نوع ناشر" />
                    <button type="button" onclick="openPublisherTypeSearch()" class="btn btn-info">🔍 جستجو</button>
                </div>
                <div id="selectedTypeInfo" class="selected-type-info">
                    <strong>نوع ناشر:</strong> <span id="selectedTypeName"></span>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" id="submitBtn" class="btn btn-success">ذخیره</button>
                <button type="button" onclick="closeModal()" class="btn btn-danger">انصراف</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal جستجوی نوع ناشر -->
<div id="publisherTypeSearchModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closePublisherTypeSearch()">×</span>
        <h2 class="modal-title">جستجوی نوع ناشر</h2>

        <div class="search-container">
            <input type="text" id="typeSearchInput" placeholder="جستجو بر اساس نام نوع ناشر..." />
            <button onclick="searchPublisherTypes()" class="btn btn-primary">جستجو</button>
            <button onclick="clearTypeSearch()" class="btn btn-secondary">پاک کردن</button>
        </div>

        <div class="table-container">
            <table class="table-hover">
                <thead>
                <tr>
                    <th>شناسه</th>
                    <th>نام نوع ناشر</th>
                    <th>انتخاب</th>
                </tr>
                </thead>
                <tbody id="publisherTypeTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- لینک به فایل JavaScript -->
<script th:src="@{/js/publisher.js}"></script>

</body>
</html>
