<!DOCTYPE html>
<html lang="fa" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت نویسندگان</title>
    <link rel="stylesheet" th:href="@{/css/author.css}">
</head>
<body>
<div class="container">
    <!-- Header -->
    <div class="page-header">
        <h1>✍️ مدیریت نویسندگان</h1>
        <button onclick="openCreateModal()" class="btn btn-success">
            ➕ ثبت نویسنده جدید
        </button>
    </div>

    <!-- پیام‌ها -->
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <h2>لیست نویسندگان ثبت شده</h2>

    <!-- جدول لیست نویسندگان -->
    <div class="table-container">
        <table class="table-hover">
            <thead>
            <tr>
                <th>شناسه</th>
                <th>نام</th>
                <th>نام خانوادگی</th>
                <th>نوع نویسنده</th>
                <th>تاریخ ایجاد</th>
                <th>عملیات</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${authors}">
                <td th:text="${a.authorId}"></td>
                <td th:text="${a.firstName}"></td>
                <td th:text="${a.lastName}"></td>
                <td th:text="${a.authorType != null ? a.authorType.authorTypeRole : '—'}"></td>
                <td th:text="${#temporals.format(a.createdDate, 'yyyy-MM-dd')}"></td>
                <td>
                    <button onclick="openEditModal(this)" class="btn btn-warning btn-sm">✏️ ویرایش</button>
                </td>
            </tr>
            <tr th:if="${authors == null or #lists.isEmpty(authors)}">
                <td colspan="6" class="empty-state">
                    <div>📭</div>
                    <div style="margin-top: 10px;">هیچ نویسنده‌ای ثبت نشده است</div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ========== MODAL ثبت/ویرایش نویسنده ========== -->
<div id="authorModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">×</span>
        <h2 class="modal-title" id="modalTitle">ثبت نویسنده جدید</h2>

        <form id="authorForm" th:action="@{/author/saveAuthor}" method="post" th:object="${authorDto}">
            <input type="hidden" id="authorId" name="authorId" />

            <!-- ====== نام ====== -->
            <div class="form-group">
                <label for="firstName">نام <span class="required">*</span></label>
                <input type="text" id="firstName" name="firstName" required placeholder="نام نویسنده را وارد کنید" />
            </div>

            <!-- ====== نام خانوادگی ====== -->
            <div class="form-group">
                <label for="lastName">نام خانوادگی <span class="required">*</span></label>
                <input type="text" id="lastName" name="lastName" required placeholder="نام خانوادگی نویسنده را وارد کنید" />
            </div>

            <!-- ====== نوع نویسنده ====== -->
            <div class="form-group">
                <label for="authorTypeId">نوع نویسنده <span class="required">*</span></label>
                <div class="search-container">
                    <input type="number" id="authorTypeId" name="authorType" required style="flex:1;" placeholder="شناسه نوع نویسنده" />
                    <button type="button" onclick="openAuthorTypeSearch()" class="btn btn-info">🔍 جستجو</button>
                </div>
                <div id="selectedAuthorTypeInfo" class="selected-author-type-info">
                    <strong>نوع نویسنده:</strong> <span id="selectedAuthorTypeTitle">هیچ نوعی انتخاب نشده</span>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success">ذخیره</button>
                <button type="button" onclick="closeModal()" class="btn btn-danger">انصراف</button>
            </div>
        </form>
    </div>
</div>

<!-- ========== MODAL جستجوی نوع نویسنده ========== -->
<div id="authorTypeSearchModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeAuthorTypeSearch()">×</span>
        <h2 class="modal-title">🔍 جستجوی نوع نویسنده</h2>

        <div class="search-container">
            <input type="text" id="authorTypeSearchInput" placeholder="جستجو بر اساس عنوان یا توضیحات..." />
            <button onclick="searchAuthorTypes()" class="btn btn-primary">جستجو</button>
            <button onclick="clearAuthorTypeSearch()" class="btn btn-secondary">پاک کردن</button>
        </div>

        <div class="table-container">
            <table class="table-hover">
                <thead>
                <tr>
                    <th>شناسه</th>
                    <th>عنوان</th>
                    <th>توضیحات</th>
                    <th>انتخاب</th>
                </tr>
                </thead>
                <tbody id="authorTypeTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script th:src="@{/js/author.js}"></script>
</body>
</html>
