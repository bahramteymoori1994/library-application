<!DOCTYPE html>
<html lang="fa" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت انواع ناشران</title>

    <!-- لینک به فایل CSS -->
    <link rel="stylesheet" th:href="@{/css/publisherType.css}">
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="page-header">
        <h1><span class="icon">📑</span> مدیریت انواع ناشران</h1>
        <button onclick="openCreateModal()" class="btn btn-success btn-lg">
            ➕ ثبت نوع ناشر جدید
        </button>
    </div>

    <!-- نمایش پیام‌ها -->
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <hr>

    <!-- Search Panel (اختیاری) -->
    <div class="search-panel">
        <h3>🔍 جستجوی انواع ناشران</h3>
        <form id="searchForm" onsubmit="searchPublisherTypes(event)">
            <div class="search-grid">
                <div class="search-group">
                    <label for="searchTypeName">عنوان نوع ناشر:</label>
                    <input type="text" id="searchTypeName" name="typeName" placeholder="جستجوی عنوان..." />
                </div>
            </div>

            <div class="search-buttons">
                <button type="submit" class="btn btn-primary">🔍 جستجو</button>
                <button type="reset" class="btn btn-secondary" onclick="resetSearch()">🔄 پاک کردن</button>
            </div>
        </form>
    </div>

    <!-- Result Count -->
    <div th:if="${publisherTypes != null}" class="result-count">
        تعداد نتایج: <strong th:text="${#lists.size(publisherTypes)}"></strong>
    </div>

    <h2>لیست انواع ناشران ثبت شده</h2>

    <!-- Table -->
    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>شناسه</th>
                <th>عنوان نوع ناشر</th>
                <th>تاریخ ایجاد</th>
                <th>ساعت ایجاد</th>
                <th>ایجاد کننده</th>
                <th>عملیات</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${publisherTypes}" th:if="${publisherTypes != null and not #lists.isEmpty(publisherTypes)}"
                th:data-id="${p.publisherTypeId}"
                th:data-typename="${p.typeName}">

                <td th:text="${p.publisherTypeId}"></td>
                <td th:text="${p.typeName}"></td>
                <td th:text="${#temporals.format(p.createdDate, 'yyyy-MM-dd')}"></td>
                <td th:text="${#temporals.format(p.createdTime, 'HH:mm:ss')}"></td>
                <td th:text="${p.createdBy}"></td>
                <td>
                    <button onclick="openEditModal(this)" class="btn btn-warning btn-sm">
                        ✏️ ویرایش
                    </button>
                </td>
            </tr>
            <tr th:if="${publisherTypes == null or #lists.isEmpty(publisherTypes)}">
                <td colspan="6" class="empty-state">
                    <span class="icon">📭</span>
                    <div class="message">هنوز هیچ نوع ناشری ثبت نشده است</div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="publisherTypeModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 class="modal-title" id="modalTitle">ثبت نوع ناشر جدید</h2>

        <form id="publisherTypeForm" th:action="@{/publisherType/savePublisherType}" method="post" th:object="${publisherTypeDto}">
            <input type="hidden" id="publisherTypeId" th:field="*{publisherTypeId}" />

            <div class="form-group">
                <label for="typeName">عنوان نوع ناشر <span class="required">*</span></label>
                <input type="text" id="typeName" th:field="*{typeName}" required placeholder="مثال: انتشارات داخلی" />
            </div>

            <div class="form-actions">
                <button type="submit" id="submitBtn" class="btn btn-success">ذخیره</button>
                <button type="button" onclick="closeModal()" class="btn btn-danger">انصراف</button>
            </div>
        </form>
    </div>
</div>

<!-- لینک به فایل JavaScript -->
<script th:src="@{/js/publisherType.js}"></script>

</body>
</html>
