<!DOCTYPE html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم ورود</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h1>خوش آمدید</h1>
        <p>برای ورود اطلاعات خود را وارد کنید</p>
    </div>

    <!-- فرم استاندارد Spring Security -->
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">نام کاربری یا ایمیل</label>
            <div class="input-wrapper">
                <span class="icon">👤</span>
                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="example@email.com"
                        required
                >
            </div>
        </div>

        <div class="form-group">
            <label for="password">رمز عبور</label>
            <div class="input-wrapper">
                <span class="icon">🔒</span>
                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required
                >
            </div>
        </div>

        <!-- نمایش خطاهای احراز هویت -->
        <div th:if="${param.error}" class="error-message show" style="color: #e53e3e; margin-bottom: 15px; text-align: center;">
            ❌ نام کاربری یا رمز عبور اشتباه است
        </div>

        <div th:if="${param.logout}" class="success-message show" style="color: #38a169; margin-bottom: 15px; text-align: center;">
            ✅ با موفقیت خارج شدید
        </div>

        <div class="form-options">
            <label>
                <input type="checkbox" id="remember" name="remember-me">
                مرا به خاطر بسپار
            </label>
            <a href="#">رمز عبور را فراموش کرده‌اید؟</a>
        </div>

        <button type="submit" class="btn-login">
            ورود
        </button>
    </form>

    <div class="signup-link">
        حساب کاربری ندارید؟ <a href="#">ثبت نام کنید</a>
    </div>
</div>

<script th:src="@{/js/login.js}"></script>
</body>
</html>
