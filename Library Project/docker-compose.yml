services:
  redis:
    image: redis:7-alpine
    container_name: redis-library
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - library-network
    command: redis-server --appendonly yes

volumes:
  mysql_data:
  redis_data:

networks:
  library-network:
    driver: bridge